    showModal("Error", String(message), [{ label: "OK", primary: true }]);
  }
  try {
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progBar.classList.remove("animate");
        var pct = Math.round(progress * 100);
        progFill.style.width = pct + "%";
        loadStatus.textContent = progress >= 1 ? "Starting..." : "Loading... " + pct + "%";
      }).then(function (instance) {
        loadBox.style.display = "none";
        unityInstance = instance;
      }).catch(function (message) { bootError(message); });
    };
    script.onerror = function () { bootError("Could not load " + loaderUrl); };
    document.body.appendChild(script);
  } catch (e) {

function installCkanFile(text, name) {
  var data;
  try { data = JSON.parse(text); } catch (e) {
    showModal("Error", "Error trying to parse \"" + name + "\"", [{ label: "OK", primary: true }]);
    return;
  }
  var deps = Array.isArray(data.depends) ? data.depends : [];
  var missing = [];
  deps.forEach(function (d) {
    var id = typeof d === "string" ? d : d.name;
    var m = id && byId(id);
    if (m && !effectiveInstalled(id)) staged[id] = true;
    else if (!m) missing.push(id);
  });
  if (data.identifier && byId(data.identifier) && !data.depends) staged[data.identifier] = true;
  renderAll();
  if (missing.length) {
    showModal("CKAN", "Not found.\n\n" + missing.join("\n"), [{ label: "OK", primary: true }]);
  } else {
    switchTab("changeset");
  }
}
