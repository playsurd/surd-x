function fixupfilepath(fname, path)
{	//we just have a filename, try to guess where to put it.
	if (path != "")

	var ext = fname.substr(fname.lastIndexOf('.') + 1);
	if (ext == 'fmf' || ext == 'kpf')	//these are the only files that really make sense in the root.
		return fname;
	if (ext == 'bsp' || ext == 'map' || ext == 'lit' || ext == 'lux')

			else

// Browsers pause requestAnimationFrame in hidden tabs, so the engine main loop
// stops stepping -> it stops sending netchan packets -> the server times us out
// and we return to a dead/disconnected connection. Drive the engine's rAF
// callbacks from a Web Worker tick while hidden so a keepalive packet keeps
// flowing and the slot stays alive. When visible, the real rAF is used unchanged.
(function(){

    try { rec.cb(performance.now()); } catch(e){}

    if (!document.hidden) return;
